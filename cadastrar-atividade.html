<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Atividade</title>
    <link rel="stylesheet" href="cadastrar-atividade.css">
</head>
<body>

    <main class="pagina-form">

        <header class="cabecalho">
            <a href="indexx.html" class="voltar">&larr; Voltar</a>
            <p class="mini-titulo">PORTFÓLIO • ADMIN</p>
            <h1>Cadastrar <span>atividade</span></h1>
            <p class="descricao">
                Adicione uma nova atividade ao portfólio. Ela será salva no
                banco de dados e aparecerá no eixo correspondente.
            </p>
        </header>

        <form id="formAtividade" class="formulario" enctype="multipart/form-data">

            <div class="campos">

                <div class="campo">
                    <label for="eixo">Eixo (matéria)</label>
                    <select id="eixo" name="eixo" required>
                        <option value="">Selecione o eixo...</option>
                        <option value="Linguagens">Linguagens</option>
                        <option value="Humanas">Humanas</option>
                        <option value="Matemática">Matemática</option>
                        <option value="Natureza">Natureza</option>
                        <option value="SENAI">SENAI</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="numero_eixo">Número do Eixo</label>
                    <select id="numero_eixo" name="numero_eixo" required>
                        <option value="">Selecione...</option>
                        <option value="1">Eixo 1</option>
                        <option value="2">Eixo 2</option>
                        <option value="3">Eixo 3</option>
                        <option value="4">Eixo 4</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="data">Data</label>
                    <input type="date" id="data" name="data" required>
                </div>

                <div class="campo">
                    <label for="nome">Nome da atividade</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex.: Mapa mental de genética" required>
                </div>

                <div class="campo">
                    <label for="imagem">Imagem da atividade</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*" required>
                    <div id="preview" class="preview" hidden>
                        <img id="previewImg" alt="Prévia da imagem">
                    </div>
                </div>

            </div>

            <div class="acoes">
                <button type="submit" class="btn-salvar">Salvar atividade</button>
                <button type="button" class="btn-limpar" onclick="limparForm()">Limpar</button>
            </div>

            <p id="mensagem"></p>

        </form>

    </main>

    <footer>
        <p>© 2026 Júlia Santos • Portfólio</p>
    </footer>

    <script src="supabase-config.js"></script>
    <script src="supabase.js"></script>
    <script src="cadastrar-atividade.js"></script>

</body>
</html>
